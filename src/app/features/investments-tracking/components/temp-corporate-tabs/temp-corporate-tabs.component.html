<app-expansion-panel
  [title]="'Transactions & Corporate Actions'"
  [subtitle]="'Review temporary transactions and apply corporate actions'"
  [titleIcon]="'Database'"
  [iconBgClass]="'bg-gradient-to-br from-[#FACC15] to-[#EAB308] p-2 rounded-lg text-white'"
  [isExpanded]="true"
  class="animate-fade-in-up stagger-2"
>
  <div class="space-y-6">
    <div class="bg-[#232323] border border-[#3A3A3A] rounded-lg p-1 grid grid-cols-1 md:grid-cols-3 gap-1 max-w-xl">
      <button (click)="activeTab = 'temporary'"
        [ngClass]="activeTab === 'temporary' ? 'bg-[#FACC15]/20 text-[#FACC15] font-medium' : 'text-[#B3B3B3] hover:bg-[#2E2E2E]'"
        class="flex items-center justify-center gap-2 px-3 py-2 rounded-md transition-all text-sm">
        <lucide-icon name="database" class="h-4 w-4"></lucide-icon>
        Temporary
      </button>
      <button (click)="activeTab = 'list-actions'"
        [ngClass]="activeTab === 'list-actions' ? 'bg-[#8B5CF6]/20 text-[#8B5CF6] font-medium' : 'text-[#B3B3B3] hover:bg-[#2E2E2E]'"
        class="flex items-center justify-center gap-2 px-3 py-2 rounded-md transition-all text-sm">
        <lucide-icon name="file-text" class="h-4 w-4"></lucide-icon>
        All Actions
      </button>
      <button (click)="activeTab = 'add-action'"
        [ngClass]="activeTab === 'add-action' ? 'bg-[#3B82F6]/20 text-[#3B82F6] font-medium' : 'text-[#B3B3B3] hover:bg-[#2E2E2E]'"
        class="flex items-center justify-center gap-2 px-3 py-2 rounded-md transition-all text-sm">
        <lucide-icon name="plus" class="h-4 w-4"></lucide-icon>
        Add Action
      </button>
    </div>

    @if (activeTab === 'temporary') {
      <app-temp-transactions-table [userEmail]="userEmail" (actionApplied)="onActionApplied()"></app-temp-transactions-table>
    }

    @if (activeTab === 'list-actions') {
      <app-corporate-action-list></app-corporate-action-list>
    }

    @if (activeTab === 'add-action') {
      <app-add-corporate-action (actionAdded)="onActionAdded()"></app-add-corporate-action>
    }
  </div>
</app-expansion-panel>
