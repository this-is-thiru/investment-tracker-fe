<app-expansion-panel
  [title]="'Upload Transactions'"
  [subtitle]="'Start by uploading your transaction files'"
  [titleIcon]="'Upload'"
  [iconBgClass]="
    'bg-gradient-to-br from-[#10A37F] to-[#0D8968] p-2 rounded-lg text-white'
  "
  [isExpanded]="true"
  class="animate-fade-in-up stagger-2"
>
  <div class="space-y-6">

    <!-- Quarter banner (always visible) -->
    <div
      class="flex items-center justify-between gap-3 px-4 py-3 bg-[#232323] border border-[#3A3A3A] rounded-xl"
    >
      <div class="flex items-center gap-2">
        <lucide-icon
          name="calendar"
          class="h-4 w-4 text-[#10A37F]"
        ></lucide-icon>
        <span
          class="text-xs font-bold text-[#A0A0A0] uppercase tracking-wide"
          >Quarter</span
        >
        <span
          class="ml-1 px-2 py-0.5 rounded-full bg-[#10A37F]/15 border border-[#10A37F]/40 text-[#10A37F] font-semibold text-xs"
          >{{ quarter }}</span
        >
      </div>
      <p-select
        id="quarterSelect"
        [options]="quarters"
        [ngModel]="quarter"
        (ngModelChange)="onQuarterChange($event)"
        optionLabel="label"
        optionValue="value"
        placeholder="Select Quarter"
        styleClass="bg-[#2E2E2E] border border-[#3A3A3A] rounded-lg text-white text-sm"
        appendTo="body"
      >
      </p-select>
    </div>

    <!-- File selection area -->
    <div
      (dragover)="handleDragOver($event)"
      (drop)="handleDrop($event)"
      (click)="fileInput.click()"
      class="border-2 border-dashed border-[#3A3A3A] rounded-xl p-12 text-center hover:border-[#10A37F]/50 hover:bg-[#10A37F]/5 transition-all cursor-pointer group"
    >
      <div
        class="bg-[#10A37F]/10 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 group-hover:scale-110 transition-transform"
      >
        <lucide-icon
          name="upload"
          class="h-8 w-8 text-[#10A37F]"
        ></lucide-icon>
      </div>
      <p class="text-white mb-2 font-medium">
        Drag and drop your transaction file here
      </p>
      <p class="text-[#B3B3B3] text-sm mb-4">or click to browse files</p>
      <button
        type="button"
        class="px-6 py-2.5 bg-gradient-to-r from-[#10A37F]/60 to-[#0D8968]/60 text-white rounded-lg font-medium hover:shadow-lg transition-all hover-scale"
      >
        Select Files
      </button>
      <p class="text-xs text-[#666666] mt-4">
        Supported formats: XLSX, XLS (Max 10MB)
      </p>
      <input
        #fileInput
        type="file"
        accept=".xlsx,.xls"
        class="hidden"
        (change)="onFilePicked($event)"
      />
    </div>

    @if (fileError) {
      <div
        class="flex items-start justify-between gap-3 bg-red-500/10 border border-red-500/40 rounded-xl px-4 py-3 animate-fade-in"
      >
        <div class="flex items-start gap-2 min-w-0">
          <lucide-icon
            name="alert-circle"
            class="h-5 w-5 text-red-400 mt-0.5 flex-shrink-0"
          ></lucide-icon>
          <p class="text-sm text-red-200 break-words">{{ fileError }}</p>
        </div>
        <button
          type="button"
          (click)="dismissFileError()"
          class="text-red-300 hover:text-red-100 transition-colors flex-shrink-0"
          aria-label="Dismiss error"
        >
          <lucide-icon name="x" class="h-4 w-4"></lucide-icon>
        </button>
      </div>
    }

    <!-- Download Template link (always visible at bottom) -->
    <div class="pt-2">
      <button
        type="button"
        (click)="handleDownloadTemplate()"
        class="flex items-center gap-2 text-[#10A37F] hover:text-[#0D8968] hover:-translate-y-0.5 active:scale-95 transition-all"
      >
        <lucide-icon name="download" class="h-4 w-4"></lucide-icon>
        <span class="text-sm">Download Template</span>
      </button>
    </div>
  </div>
</app-expansion-panel>
