<div class="w-full min-h-screen flex flex-col bg-background text-white">
  <!-- ============================================================== -->
  <!-- HEADER STRIP                                                     -->
  <!-- ============================================================== -->
  <section class="relative bg-background overflow-hidden border-b border-divider">
    <div class="absolute inset-0 opacity-30 pointer-events-none">
      <div class="relative bg-gradient-to-br from-[#0F0F0F] via-[#121212] to-background w-full h-full"></div>
    </div>

    <div class="w-full max-w-[1760px] mx-auto px-4 sm:px-6 lg:px-8 2xl:px-12 py-10 md:py-14 relative z-10">
      <div class="inline-flex items-center gap-2 bg-warning/10 border border-warning/20 rounded-full px-3 py-1.5 mb-4">
        <lucide-icon name="Briefcase" class="w-4 h-4 text-warning"></lucide-icon>
        <span class="text-xs text-warning font-semibold uppercase tracking-wider">Investment Tracking</span>
      </div>

      <h1 class="text-3xl md:text-4xl text-white mb-2 font-semibold">
        Track your
        <span class="text-transparent bg-clip-text bg-gradient-to-r from-warning to-[#EAB308]">transactions</span>
      </h1>
      <p class="text-sm text-text-secondary max-w-2xl">
        Manage and track all your investment transactions in one place. Upload your broker sheets to get started.
      </p>
    </div>
  </section>

  <!-- MAIN BODY -->
  <main class="w-full max-w-[1760px] mx-auto px-4 sm:px-6 lg:px-8 2xl:px-12 py-8 flex-1 flex flex-col gap-6">
    <!-- Section 1: Upload & Preview Transactions (Combined) -->
    <app-upload-transactions
      [expanded]="uploadExpanded"
      (uploadComplete)="onUploadComplete()">
    </app-upload-transactions>

    <!-- Section 3: Temporary Transactions & Corporate Actions -->
    <app-temp-corporate-tabs
      [userEmail]="userEmail"
      (dataChanged)="onCorporateActionApplied()">
    </app-temp-corporate-tabs>

    <!-- Section 4: Portfolio Stocks -->
    <app-portfolio-stocks [userEmail]="userEmail" (holdingsLoaded)="onHoldingsLoaded($event)"></app-portfolio-stocks>
  </main>
</div>

<app-footer></app-footer>
