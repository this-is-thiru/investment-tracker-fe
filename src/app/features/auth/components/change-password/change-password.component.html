<ui-modal [open]="true" title="Change Password" size="sm" [dismissible]="true" (closed)="onClose()">
  <p class="text-xs text-[#999999] text-center -mt-2 mb-4">
    Enter your old password and choose a new password to update.
  </p>

  <form [formGroup]="changePasswordForm" (ngSubmit)="onSubmit()" class="space-y-4">

    <!-- Old Password -->
    <div>
      <label class="block text-xs text-[#B3B3B3] mb-1.5">Old Password</label>
      <ui-input type="password" formControlName="oldPassword" placeholder="Old password" />
    </div>

    <!-- New Password -->
    <div>
      <label class="block text-xs text-[#B3B3B3] mb-1.5">New Password</label>
      <ui-input type="password" formControlName="newPassword" placeholder="New password" />
    </div>

    <!-- Confirm New Password -->
    <div>
      <label class="block text-xs text-[#B3B3B3] mb-1.5">Confirm New Password</label>
      <ui-input type="password" formControlName="confirmPassword" placeholder="Confirm new password" [error]="passwordMismatch" />
      @if (passwordMismatch) {
        <p class="text-xs text-red-500 mt-1">Passwords do not match.</p>
      }
    </div>

    <!-- Submit Button -->
    <ui-button
      type="submit"
      variant="primary"
      [fullWidth]="true"
      [disabled]="changePasswordForm.invalid || isLoading"
      [loading]="isLoading"
    >
      Change Password
    </ui-button>

  </form>
</ui-modal>
