<span
  class="ui-spinner"
  [class.ui-spinner--sm]="size === 'sm'"
  [class.ui-spinner--md]="size === 'md'"
  [class.ui-spinner--lg]="size === 'lg'"
  [class.ui-spinner--accent]="tone === 'accent'"
  [class.ui-spinner--muted]="tone === 'muted'"
  [class.ui-spinner--white]="tone === 'white'"
  role="status"
  aria-label="Loading"
></span>
