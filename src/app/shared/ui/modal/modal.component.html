@if (open) {
  <div class="ui-modal__backdrop animate-fade-in" (click)="handleBackdropClick()">
    <div
      class="ui-modal__panel animate-scale-in"
      [ngClass]="'ui-modal__panel--' + size"
      (click)="$event.stopPropagation()"
    >
      @if (title || dismissible) {
        <div class="ui-modal__header">
          <ng-content select="[modalHeader]"></ng-content>
          @if (title) {
            <h3 class="ui-modal__title">{{ title }}</h3>
          }
          @if (dismissible) {
            <button type="button" class="ui-modal__close" (click)="close()" aria-label="Close">
              <lucide-icon name="x" class="w-4 h-4"></lucide-icon>
            </button>
          }
        </div>
      }

      <div class="ui-modal__body">
        <ng-content></ng-content>
      </div>

      <ng-content select="[modalFooter]"></ng-content>
    </div>
  </div>
}
